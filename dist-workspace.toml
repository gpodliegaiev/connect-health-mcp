[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
# ~/.local/bin is on PATH on most Linux systems; the installer adds it to the shell profile otherwise
install-path = "~/.local/bin/"
# Whether to install an updater program
# Install garmin-mcp-update next to the binary (update.rs suggests it in the update notice)
install-updater = true
# Archive format for macOS and Linux (.tar.gz opens everywhere without extra tools)
unix-archive = ".tar.gz"
