[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
# ~/.local/bin is on PATH on most Linux systems; the installer adds it to the shell profile otherwise
install-path = "~/.local/bin/"
# Whether to install an updater program
# Install garmin-mcp-update next to the binary (update.rs suggests it in the update notice)
install-updater = true
# Archive format for macOS and Linux (.tar.gz opens everywhere without extra tools)
unix-archive = ".tar.gz"
# Extra files in every archive. The license notices of everything built into
# the binary must ship with it: the crates (THIRD-PARTY-LICENSES.html, see
# about.toml for how to regenerate it), Rust's standard library
# (RUST-STD-LICENSES.html, the toolchain's share/doc/rust/COPYRIGHT-library.html)
# and musl libc, statically linked into the Linux build (MUSL-LICENSE.txt)
include = ["THIRD-PARTY-LICENSES.html", "RUST-STD-LICENSES.html", "MUSL-LICENSE.txt"]
# Sign build provenance for every artifact, so users can check that a binary
# was built from this repo by this workflow (`gh attestation verify`)
github-attestations = true

# Pin the workflow's GitHub actions to exact commits instead of movable tags
# (a moved tag can't change what runs with the release token). Comments name
# the version; bump these when upgrading dist, then run `dist generate`
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
