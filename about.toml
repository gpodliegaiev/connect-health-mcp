# Config for `cargo about`, which writes THIRD-PARTY-LICENSES.html: the
# license notices of every crate built into the release binaries.
# Regenerate after changing dependencies:
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.html
# It fails if a crate has a license missing from `accepted`; add it only after
# checking it is compatible with shipping under MIT.

# Licenses we may ship, in order of preference (for "A OR B" crates the first
# accepted one is used).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
]

# Only crates built for the release targets (see dist-workspace.toml).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]

# Leave out test-only and build-only crates: they are not in the binary.
ignore-dev-dependencies = true
ignore-build-dependencies = true

# Built-in fixes from cargo-about for popular crates with unusual license
# files: chrono puts the MIT and Apache-2.0 texts in one file.
workarounds = ["chrono"]

# --- Crate clarifications -------------------------------------------------
# cargo-about reads each crate's license files to copy the real text, with
# its copyright lines, into the notices page. When it can't recognize a file,
# it falls back to a generic template with `<year> <owner>` placeholders,
# which lacks the copyright notice the license requires. The entries below
# name the right file for those crates. `checksum` is the file's SHA-256
# (`shasum -a 256 <file>` in ~/.cargo/registry/src/*/<crate>-<version>/): if
# a new crate version changes the file, cargo-about warns and the entry must
# be checked and updated.

# aws-lc-sys (the crypto library behind TLS) has one combined LICENSE file
# listing every copyright holder (Amazon, Google/BoringSSL, the OpenSSL
# Project, Eric Young, ...) and the full license texts, so the whole file is
# used for each of its licenses.
[aws-lc-sys.clarify]
license = "ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT) AND (Apache-2.0 OR ISC OR MIT-0)"
[[aws-lc-sys.clarify.files]]
path = "LICENSE"
checksum = "728536b4160e051f86d7c9c388f704866b3d512cd7df97ac3516c65279523c4e"

# aws-lc-rs: Apache-2.0 text plus the ISC text with Amazon's copyright, in
# one file.
[aws-lc-rs.clarify]
license = "ISC AND (Apache-2.0 OR ISC)"
[[aws-lc-rs.clarify.files]]
path = "LICENSE"
checksum = "b50b376e7d24a0598488b730c3034ffcd0b58dd36c0913a24b9903a3cfd04bf7"

# The windows-* crates (Windows build only): cargo-about doesn't recognize
# their license files. All of them ship the same two files.

[windows-core.clarify]
license = "MIT OR Apache-2.0"
[[windows-core.clarify.files]]
